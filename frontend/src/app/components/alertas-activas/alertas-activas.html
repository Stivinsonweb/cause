@if (alertas && alertas.length > 0) {
  <div class="border-b border-paper/15 bg-swamp/70 px-6 py-2.5 backdrop-blur-sm">
    <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-center gap-x-5 gap-y-1 overflow-hidden">
      <span class="flex items-center gap-1.5 text-xs font-medium uppercase tracking-wide text-paper/60">
        <svg lucideTriangleAlert [size]="13" [strokeWidth]="2"></svg>
        Alertas activas
      </span>
      @for (alerta of visibles(); track alerta.municipio_id + alerta.tipo_evento) {
        <span class="flex items-center gap-1.5 whitespace-nowrap text-sm text-paper">
          <span class="h-2 w-2 flex-shrink-0 rounded-full" [style.background]="color[alerta.nivel_riesgo]"></span>
          {{ alerta.municipio_nombre }} · {{ nombreTipo(alerta.tipo_evento) }} · {{ etiqueta[alerta.nivel_riesgo] }}
        </span>
      }
      @if (restantes() > 0) {
        <a href="#mapa" class="text-sm text-paper/70 underline underline-offset-2 hover:text-paper">
          +{{ restantes() }} más
        </a>
      }
    </div>
  </div>
}
