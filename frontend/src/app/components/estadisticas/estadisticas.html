<section class="border-y border-line bg-paper-dim">
  <div class="mx-auto grid max-w-5xl grid-cols-2 gap-6 px-6 py-10 sm:grid-cols-4">
    <div class="text-center">
      <svg lucideMapPinned class="mx-auto mb-2 h-5 w-5 text-teal-light" [size]="20" [strokeWidth]="1.75"></svg>
      <p class="font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.total_municipios ?? '—' }}
      </p>
      <p class="mt-1 text-xs text-ink-soft sm:text-sm">municipios monitoreados</p>
    </div>
    <div class="text-center">
      <svg lucideUsers class="mx-auto mb-2 h-5 w-5 text-teal-light" [size]="20" [strokeWidth]="1.75"></svg>
      <p class="font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos ? (datos.poblacion_total | number) : '—' }}
      </p>
      <p class="mt-1 text-xs text-ink-soft sm:text-sm">habitantes cubiertos (est.)</p>
    </div>
    <div class="text-center">
      <svg lucideRadioTower class="mx-auto mb-2 h-5 w-5 text-teal-light" [size]="20" [strokeWidth]="1.75"></svg>
      <p class="font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.estaciones_activas ?? '—' }}
      </p>
      <p class="mt-1 text-xs text-ink-soft sm:text-sm">estaciones IDEAM activas</p>
    </div>
    <div class="text-center">
      <svg lucideHistory class="mx-auto mb-2 h-5 w-5 text-teal-light" [size]="20" [strokeWidth]="1.75"></svg>
      <p class="font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.eventos_documentados ?? '—' }}
      </p>
      <p class="mt-1 text-xs text-ink-soft sm:text-sm">eventos históricos documentados</p>
    </div>
  </div>
</section>
