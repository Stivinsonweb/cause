<section class="border-y border-line bg-paper-dim">
  <dl class="mx-auto grid max-w-5xl grid-cols-2 divide-y divide-x divide-line px-6 py-8 sm:grid-cols-4 sm:divide-y-0">
    <div class="px-4 py-3 sm:px-6 sm:py-0">
      <dt class="font-mono text-[0.68rem] uppercase tracking-wide text-ink-soft">Municipios monitoreados</dt>
      <dd class="mt-2 font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.total_municipios ?? '—' }}
      </dd>
    </div>
    <div class="px-4 py-3 sm:px-6 sm:py-0">
      <dt class="font-mono text-[0.68rem] uppercase tracking-wide text-ink-soft">Habitantes cubiertos (est.)</dt>
      <dd class="mt-2 font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos ? (datos.poblacion_total | number) : '—' }}
      </dd>
    </div>
    <div class="px-4 py-3 sm:px-6 sm:py-0">
      <dt class="font-mono text-[0.68rem] uppercase tracking-wide text-ink-soft">Estaciones IDEAM activas</dt>
      <dd class="mt-2 font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.estaciones_activas ?? '—' }}
      </dd>
    </div>
    <div class="px-4 py-3 sm:px-6 sm:py-0">
      <dt class="font-mono text-[0.68rem] uppercase tracking-wide text-ink-soft">Eventos históricos documentados</dt>
      <dd class="mt-2 font-mono text-3xl font-semibold text-swamp sm:text-4xl">
        {{ datos?.eventos_documentados ?? '—' }}
      </dd>
    </div>
  </dl>
</section>
