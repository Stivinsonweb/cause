<section class="mx-auto max-w-6xl px-6 py-10">
  <h2 class="font-serif text-2xl font-semibold text-ink sm:text-3xl">Municipios en riesgo</h2>
  <p class="mt-1 text-sm text-ink-soft">
    Nivel de riesgo de inundación calculado ahora mismo para cada municipio. Desliza para verlos todos.
  </p>

  <div class="mt-6 flex snap-x snap-mandatory gap-4 overflow-x-auto pb-4 [-webkit-overflow-scrolling:touch]">
    @for (item of items; track item.municipio.id) {
      <button
        type="button"
        (click)="seleccionar.emit(item.municipio.id)"
        class="w-64 flex-shrink-0 snap-start rounded-lg border bg-paper p-5 text-left transition-shadow hover:shadow-md"
        [class.border-teal]="item.municipio.id === seleccionadoId"
        [class.border-line]="item.municipio.id !== seleccionadoId"
      >
        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-full" [style.background]="colorDe(item)"></span>
          <span class="text-xs font-medium uppercase tracking-wide text-ink-soft">
            {{ etiquetaDe(item) }}
          </span>
        </div>
        <p class="mt-3 font-serif text-xl font-semibold text-ink">{{ item.municipio.nombre }}</p>
        <p class="mt-1 text-xs text-ink-soft">
          {{ item.municipio.poblacion_estimada | number }} habitantes (est.)
        </p>
        @if (item.riesgo?.variables_entrada) {
          <p class="mt-3 font-mono text-lg text-swamp">
            {{ item.riesgo!.variables_entrada!['lluvia_acum_7d'] }} mm
          </p>
          <p class="text-xs text-ink-soft">lluvia acumulada, 7 días</p>
        }
      </button>
    }
  </div>
</section>
