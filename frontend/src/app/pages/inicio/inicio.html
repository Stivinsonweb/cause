<app-navbar />

<app-hero [alertas]="alertasActivas()" />

<app-estadisticas [datos]="estadisticas()" />

<section id="mapa" class="grid min-h-[640px] grid-cols-1 bg-paper-dim md:grid-cols-[2fr_1fr]">
  <div class="relative min-h-[420px]">
    <app-mapa-cuencas
      class="block h-full w-full"
      [municipios]="municipios()"
      [riesgoPorMunicipio]="riesgoPorMunicipio()"
      [riesgoDetallePorMunicipio]="riesgoInundacionPorMunicipio()"
      [municipioSeleccionadoId]="municipioSeleccionado()?.id ?? null"
      (municipioSeleccionado)="seleccionarMunicipio($event)"
    />
    <div class="absolute right-4 top-4 z-[1000]">
      <app-leyenda-riesgo />
    </div>
  </div>
  <div class="overflow-y-auto border-t border-line md:border-l md:border-t-0">
    <app-panel-riesgo
      [municipio]="municipioSeleccionado()"
      [riesgo]="riesgoSeleccionado()"
      [cargando]="cargandoDetalle()"
    />
    <div class="px-5 pb-5">
      <app-reporte-comunitario
        [municipioId]="municipioSeleccionado()?.id ?? null"
        [municipioNombre]="municipioSeleccionado()?.nombre ?? null"
      />
    </div>
  </div>
</section>

<app-slider-riesgo
  [items]="itemsSlider()"
  [seleccionadoId]="municipioSeleccionado()?.id ?? null"
  (seleccionar)="seleccionarMunicipio($event)"
/>

<app-como-funciona />

<section id="historico" class="mx-auto max-w-6xl px-6 py-10">
  <app-historico-municipio
    [municipio]="municipioSeleccionado()"
    [historico]="historicoSeleccionado()"
    [cargando]="cargandoDetalle()"
  />
</section>

<app-footer-fuentes />
